<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Cantina da Honestidade</title>

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/login_cadastro.css">
</head>

<body>

    <main class="pagina-autenticacao">

        <section class="card-autenticacao">

            <a class="link-inicio" href="../index.html">← Voltar ao início</a>
            <h1>Criar conta</h1>
            <p class="subtitulo-autenticacao">
                Preencha os dados para se cadastrar.
            </p>

            <form id="form-cadastro">

                <div class="campo-formulario">
                    <label for="matricula-cadastro">Matrícula</label>
                    <input
                        type="text"
                        id="matricula-cadastro"
                        name="matricula"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="campo-formulario">
                    <label for="email-cadastro">E-mail</label>
                    <input
                        type="email"
                        id="email-cadastro"
                        name="email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="campo-formulario">
                    <label for="senha-cadastro">Senha</label>
                    <input
                        type="password"
                        id="senha-cadastro"
                        name="senha"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="campo-formulario">
                    <label for="confirmar-senha-cadastro">
                        Confirmar senha
                    </label>
                    <input
                        type="password"
                        id="confirmar-senha-cadastro"
                        name="confirmar-senha"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button type="submit" class="botao botao-principal">
                    Criar conta
                </button>

            </form>

            <p class="texto-alternativo">
                Já tem uma conta?
                <a href="login.html">Entrar</a>
            </p>

        </section>

    </main>

</body>

</html>
